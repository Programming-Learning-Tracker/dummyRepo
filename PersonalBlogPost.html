<!--
Task 1 - Text & Typography Structure
Build a simple "My Personal Blog Post" page. This task is about
exercising different typography in HTML

Follow this:
    - Have <!DOCTYPE html> in VS Code by doing: ! + Tab (sometimes it does not work)
    - Have <h1> page title: My Personal Blog Post
    - Have <h2> of your name
    - Have three body paragraphs (you can use Lorem ipsum)
    - Use these inline emphasis for atleast once in any words in 
      your paragraph. Namely, <strong>, <em>, <mark>, <b>, <i>
    - Have one <blockquote> and put any pull quote there

    - Have a title <h3> for each of the proceeding lists
    - Have an unordered list of your hobies. Use <ul> and <li>
    - Have ordered list of your fav subjects. Use <ol> and <li>

You must know that headers is from <h1> to <h6>
-->
